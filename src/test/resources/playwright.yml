browser: chrome

chromiumConfig:
  channel: chrome
  args:
    - --unsafely-treat-insecure-origin-as-secure=http://www.uitestingplayground.com
  permissions:
    - clipboard-read
    - clipboard-write

firefoxConfig:
  userPrefs:
    dom.events.testing.asyncClipboard: true
    dom.events.asyncClipboard.readText: true
    dom.securecontext.allowlist: www.uitestingplayground.com

## For Webkit clipboard permissions are not supported
webkitConfig: {}